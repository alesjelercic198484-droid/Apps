name: Build Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Privzeti URL strežnika (backend), npr. https://3000-xxxx.e2b.app'
        required: false
        default: ''
  push:
    branches:
      - arena/83db93d2-apps
    paths:
      - 'src/**'
      - 'server/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # GitHub's ubuntu-latest Android image already includes the SDK,
      # build-tools and sdkmanager. Avoid an extra setup action so builds also
      # work on the current Node 24 based runners.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/tools/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE: ${{ inputs.api_base }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: slopromet-gps-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Arena cannot download GitHub's Azure-hosted Actions artifacts directly.
      # For a manually requested test build, publish the small debug APK on the
      # current branch so it can be delivered to the user from the workspace.
      - name: Publish test APK on branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/SloPromet-GPS-debug.apk
          sha256sum releases/SloPromet-GPS-debug.apk > releases/SloPromet-GPS-debug.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/SloPromet-GPS-debug.apk releases/SloPromet-GPS-debug.apk.sha256
          git commit -m "Build Android test APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
